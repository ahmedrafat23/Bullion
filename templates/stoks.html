{% extends "base.html" %}

{% block content %}
<h1>Stock Prices</h1>
<div id="stocks-data">
    <!-- JavaScript will populate this section with live data -->
</div>
<script>
    fetch('/get-stocks')
        .then(response => response.json())
        .then(data => {
            const stocksDiv = document.getElementById('stocks-data');
            stocksDiv.innerHTML = JSON.stringify(data, null, 2);
        })
        .catch(error => console.error('Error fetching stocks data:', error));
</script>
{% endblock %}
