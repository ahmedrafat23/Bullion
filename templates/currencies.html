{% extends "base.html" %}

{% block content %}
<h1>Currencies Exchange Rates</h1>
<div id="currencies-data">
    <!-- JavaScript will populate this section with live data -->
</div>
<script>
    fetch('/get-currencies')
        .then(response => response.json())
        .then(data => {
            const currenciesDiv = document.getElementById('currencies-data');
            currenciesDiv.innerHTML = JSON.stringify(data, null, 2);
        })
        .catch(error => console.error('Error fetching currencies data:', error));
</script>
{% endblock %}
